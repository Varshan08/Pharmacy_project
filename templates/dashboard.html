<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

   <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div id="notify-container"></div>

<div class="navbar">

<a href="/dashboard">
<i class="fa fa-home"></i> Home
</a>

<a href="/addpage">
<i class="fa fa-plus"></i> Add
</a>

<a href="/stock">
<i class="fa fa-box"></i> Stock
</a>

<a href="/">
<i class="fa fa-sign-out"></i> Logout
</a>

</div>


<div class="main">

<h2>Dashboard</h2>

<div class="card-box">

<a href="/lowstock" class="card low">
Low {{low}}
</a>

<a href="/stock" class="card exp">
Expiry {{exp}}
</a>

<a href="/expired" class="card danger">
Expired {{expired}}
</a>

</div>


</div>

<script>

let lowItems = JSON.parse('{{ low_list | tojson | safe }}');
let expItems = JSON.parse('{{ exp_list | tojson | safe }}');

if(lowItems.length > 0){
    showNotify("Low Stock", lowItems.join(", "), "warning");
}

if(expItems.length > 0){
    showNotify("Expiry Alert", expItems.join(", "), "error");
}

</script>

<script>

function sendWhatsApp(){

    fetch("/whatsapp_alert")
    .then(res => res.json())
    .then(data => {

        if(!data.msg){
            showNotify("No Low Stock", "All items are sufficient", "success");
            return;
        }

        let phone = "91XXXXXXXXXX";   // 🔥 supplier number

        let url = `https://wa.me/${phone}?text=${encodeURIComponent(data.msg)}`;

        window.open(url, "_blank");

        showNotify("WhatsApp Ready", "Message opened", "success");

    });

}

</script>

<script>

function checkAlerts(){

    fetch("/check_alerts")
    .then(res => res.json())
    .then(data => {

        if(data.low.length > 0){
            showNotify(
                "Low Stock",
                data.low.join(", "),
                "warning"
            );
        }

        if(data.exp.length > 0){
            showNotify(
                "Expiry Alert",
                data.exp.join(", "),
                "error"
            );
        }

        // 🔥 EMAIL STATUS UI
        if(data.email_status === "success"){
            showNotify(
                "Email Sent",
                "Supplier notified successfully",
                "success"
            );
        }

        if(data.email_status === "error"){
            showNotify(
                "Email Failed",
                "Check email configuration",
                "error"
            );
        }

    });

}

// run every 5 mins
setInterval(checkAlerts, 300000);

// run once
checkAlerts();

</script>

</div>
<a href="/dashboard" class="back-btn">Back</a>

<div id="toast-container"></div>

<div class="wa-float" onclick="sendWhatsApp()">

    <i class="fa fa-whatsapp"></i>

    <!-- 🔴 BADGE -->
    <span id="wa-badge" class="wa-badge">0</span>

    <span class="wa-tooltip">Order Stock</span>

</div>

</body>
</html>
