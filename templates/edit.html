<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Medicine</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="navbar">
    <span class="brand">💊 PHARMACARE</span>
    <a href="/dashboard"><i class="fa fa-home"></i> Dashboard</a>
    <a href="/addpage"><i class="fa fa-plus"></i> Add</a>
    <a href="/stock" class="active"><i class="fa fa-box"></i> Stock</a>
    <a href="/billing"><i class="fa fa-receipt"></i> Billing</a>
    <a href="/logout" class="logout"><i class="fa fa-sign-out-alt"></i> Logout</a>
</div>

<div class="main">
    <div class="page-title">
        <i class="fa fa-edit"></i> Edit Medicine
    </div>

    <div class="box" style="max-width:500px; margin:auto;">
        <form action="/update" method="post">
            <input type="hidden" name="id" value="{{ m[0] }}">

            <div class="form-grid single">
                <div class="form-group">
                    <label><i class="fa fa-pills"></i> Medicine Name</label>
                    <input name="name" value="{{ m[1] }}" required>
                </div>
                <div class="form-group">
                    <label><i class="fa fa-box"></i> Quantity</label>
                    <input name="quantity" type="number" value="{{ m[2] }}" required>
                </div>
                <div class="form-group">
                    <label><i class="fa fa-calendar"></i> Expiry Date</label>
                    <input name="expiry" type="date" value="{{ m[3] }}" required>
                </div>
                <div class="form-group">
                    <label><i class="fa fa-indian-rupee-sign"></i> Price</label>
                    <input name="price" value="{{ m[4] }}" required>
                </div>

                <div style="display:flex; gap:10px;">
                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fa fa-save"></i> Save Changes
                    </button>
                    <a href="/stock" class="btn btn-secondary btn-full">
                        <i class="fa fa-times"></i> Cancel
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
