<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Medicine</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div id="notify-container"></div>

<div class="navbar">
    <span class="brand">💊 PHARMACARE</span>
    <a href="/dashboard"><i class="fa fa-home"></i> Dashboard</a>
    <a href="/addpage" class="active"><i class="fa fa-plus"></i> Add</a>
    <a href="/stock"><i class="fa fa-box"></i> Stock</a>
    <a href="/billing"><i class="fa fa-receipt"></i> Billing</a>
    <a href="/logout" class="logout"><i class="fa fa-sign-out-alt"></i> Logout</a>
</div>

<div class="main">
    <div class="page-title">
        <i class="fa fa-capsules"></i> Add Medicine
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">

        <!-- FORM -->
        <div class="box">
            <h3 style="margin-bottom:20px; font-size:15px;">Medicine Details</h3>
            <form action="/add" method="post" id="addForm">
                <div class="form-grid single">
                    <div class="form-group">
                        <label><i class="fa fa-barcode"></i> Barcode</label>
                        <input id="barcode" name="barcode" placeholder="Scan or type barcode">
                    </div>
                    <div class="form-group">
                        <label><i class="fa fa-pills"></i> Medicine Name *</label>
                        <input id="name" name="name" placeholder="Enter medicine name" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fa fa-box"></i> Quantity *</label>
                        <input id="quantity" name="quantity" type="number" placeholder="Enter quantity" required min="1">
                    </div>
                    <div class="form-group">
                        <label><i class="fa fa-calendar"></i> Expiry Date *</label>
                        <input id="expiry" name="expiry" type="date" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fa fa-indian-rupee-sign"></i> Price *</label>
                        <input id="price" name="price" placeholder="Enter price" required>
                    </div>
                    <div id="existing-notice" style="display:none; padding:10px; background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.3); border-radius:8px; font-size:13px; color:var(--warning);">
                        <i class="fa fa-info-circle"></i> <span id="existing-msg"></span>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fa fa-plus"></i> Add Medicine
                    </button>
                </div>
            </form>
        </div>

        <!-- SCANNER -->
        <div class="box">
            <h3 style="margin-bottom:16px; font-size:15px;">
                <i class="fa fa-camera" style="color:var(--accent);"></i> Barcode Scanner
            </h3>

            <div style="display:flex; gap:10px; margin-bottom:16px;">
                <button onclick="startCamera()" class="btn btn-primary" id="startBtn">
                    <i class="fa fa-camera"></i> Start Camera
                </button>
                <button onclick="stopCamera()" class="btn btn-secondary" id="stopBtn" style="display:none;">
                    <i class="fa fa-stop"></i> Stop
                </button>
            </div>

            <div class="scanner-box" id="scannerBox">
                <div id="reader"></div>
                <p id="scanHint" style="color:var(--text2); font-size:13px; margin-top:12px;">
                    <i class="fa fa-camera"></i> Click "Start Camera" to scan barcode
                </p>
            </div>

            <div id="scan-result" style="display:none; margin-top:14px; padding:12px; background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.3); border-radius:8px;">
                <div style="font-size:12px; color:var(--text2); margin-bottom:4px;">SCANNED CODE</div>
                <div id="scan-code" style="font-family:var(--mono); font-size:16px; color:var(--success);"></div>
            </div>
        </div>

    </div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>

<script>
let scanner = null;

function startCamera() {
    document.getElementById("startBtn").style.display = "none";
    document.getElementById("stopBtn").style.display = "inline-flex";
    document.getElementById("scannerBox").classList.add("active");
    document.getElementById("scanHint").style.display = "none";

    scanner = new Html5Qrcode("reader");

    scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        onScanSuccess,
        onScanError
    ).catch(err => {
        showNotify("Camera Error", "Could not access camera: " + err, "error");
        stopCamera();
    });
}

function stopCamera() {
    if (scanner) {
        scanner.stop().then(() => {
            scanner = null;
            document.getElementById("startBtn").style.display = "inline-flex";
            document.getElementById("stopBtn").style.display = "none";
            document.getElementById("scannerBox").classList.remove("active");
            document.getElementById("scanHint").style.display = "block";
        });
    }
}

function onScanSuccess(decodedText) {
    // Show result
    document.getElementById("scan-result").style.display = "block";
    document.getElementById("scan-code").innerText = decodedText;

    // Fill barcode input
    document.getElementById("barcode").value = decodedText;
    document.getElementById("barcode").dispatchEvent(new Event("input"));

    // Stop camera
    stopCamera();

    showNotify("✅ Barcode Scanned", decodedText, "success");
}

function onScanError(err) {
    // silent - scanning in progress
}

// Auto-fill from barcode
document.getElementById("barcode").addEventListener("input", function () {
    let code = this.value.trim();
    if (!code) return;

    fetch("/get_medicine/" + code)
        .then(res => res.json())
        .then(data => {
            let notice = document.getElementById("existing-notice");
            let msg = document.getElementById("existing-msg");

            if (data.found) {
                document.getElementById("name").value = data.name;
                document.getElementById("price").value = data.price;
                notice.style.display = "block";
                msg.innerText = `Existing medicine found → Quantity will be added to current stock (${data.qty})`;
                showNotify("Medicine Found", data.name + " — qty will be updated", "warning");
            } else {
                document.getElementById("name").value = "";
                document.getElementById("price").value = "";
                notice.style.display = "none";
                showNotify("New Medicine", "Enter details for this barcode", "success");
            }
        });
});
</script>
</body>
</html>
