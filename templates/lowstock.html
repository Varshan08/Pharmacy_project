<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low Stock</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="navbar">
    <span class="brand">💊 PHARMACARE</span>
    <a href="/dashboard"><i class="fa fa-home"></i> Dashboard</a>
    <a href="/addpage"><i class="fa fa-plus"></i> Add</a>
    <a href="/stock"><i class="fa fa-box"></i> Stock</a>
    <a href="/billing"><i class="fa fa-receipt"></i> Billing</a>
    <a href="/logout" class="logout"><i class="fa fa-sign-out-alt"></i> Logout</a>
</div>

<div class="main">
    <div class="page-title">
        <i class="fa fa-exclamation-triangle" style="color:var(--warning);"></i> Low Stock Medicines
    </div>

    <div class="box">
        {% if data %}
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>Name</th><th>Qty</th><th>Expiry</th><th>Price</th><th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for m in data %}
                    <tr>
                        <td style="color:var(--text2); font-size:12px;">{{ m[0] }}</td>
                        <td><strong>{{ m[1] }}</strong></td>
                        <td><span class="badge badge-red">{{ m[2] }}</span></td>
                        <td>{{ m[3] }}</td>
                        <td>₹{{ m[4] }}</td>
                        <td><a href="/edit/{{ m[0] }}" class="btn btn-secondary" style="font-size:12px; padding:6px 10px;"><i class="fa fa-edit"></i> Edit</a></td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <p style="text-align:center; color:var(--text2); padding:30px;">
            <i class="fa fa-check-circle" style="font-size:32px; color:var(--success); display:block; margin-bottom:10px;"></i>
            All medicines have sufficient stock!
        </p>
        {% endif %}
    </div>
</div>
</body>
</html>
